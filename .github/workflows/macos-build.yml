name: macOS test build

# Personal test build only: produces an ad-hoc signed Apple Silicon Bettercast.app.
# No signing secrets, notarization, release, appcast, or upload outside Actions artifacts.
on:
  push:
    branches: [bettercast-foundation, bettercast-product]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Bettercast.app (arm64, ad-hoc)
    runs-on: macos-15
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      # Never try to launch Metro during the Xcode build.
      RCT_NO_LAUNCH_PACKAGER: "1"
      DERIVED_DATA: ${{ github.workspace }}/build/DerivedData
      OUT_DIR: ${{ github.workspace }}/build/out
    steps:
      - uses: actions/checkout@v4

      - name: Runner and toolchain info
        run: |
          uname -m
          sw_vers
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i macosx

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Source checks
        run: |
          bun run typecheck
          bun test ./src
          scripts/ci/check-macho-deps.test.sh
          swiftc macos/sol-macOS/lib/AIProcess.swift scripts/test-ai-process.swift -o "$RUNNER_TEMP/test-ai-process"
          "$RUNNER_TEMP/test-ai-process"

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ runner.arch }}-xcode16.4-${{ hashFiles('macos/Podfile.lock', 'bun.lock', 'patches/**') }}

      - name: Install pods
        working-directory: macos
        run: bundle exec pod install

      - name: Build (Release, arm64, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace macos/sol.xcworkspace \
            -scheme release \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM= \
            CODE_SIGN_IDENTITY=- \
            PROVISIONING_PROFILE_SPECIFIER= \
            ENABLE_HARDENED_RUNTIME=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | awk '/error:|warning: .*(sign|bundle)|\*\* BUILD|^Ld |CodeSign |PhaseScript/ { print; fflush(); }'

      - name: Product native storage tests
        run: |
          set -euo pipefail
          swiftc macos/sol-macOS/lib/AIWorkspace.swift scripts/test-ai-workspace.swift \
            -o "$RUNNER_TEMP/test-ai-workspace"
          "$RUNNER_TEMP/test-ai-workspace"
          cipher="$DERIVED_DATA/SourcePackages/checkouts/SQLCipher.swift/Sources/SQLCipher/SQLCipher.xcframework/macos-arm64_x86_64"
          test -d "$cipher/SQLCipher.framework"
          swiftc -D CLIPBOARD_TEST -F "$cipher" -framework SQLCipher \
            -Xcc -DSQLITE_HAS_CODEC=1 -Xlinker -rpath -Xlinker "$cipher" \
            macos/sol-macOS/lib/AIWorkspace.swift \
            macos/sol-macOS/lib/ClipboardRepository.swift scripts/test-clipboard.swift \
            -o "$RUNNER_TEMP/test-clipboard"
          "$RUNNER_TEMP/test-clipboard"

      - name: Package and inspect
        run: |
          set -euo pipefail
          src="$DERIVED_DATA/Build/Products/Release/bettercast.app"
          test -d "$src"
          mkdir -p "$OUT_DIR"
          ditto "$src" "$OUT_DIR/Bettercast.app"
          app="$OUT_DIR/Bettercast.app"
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          echo "== Info.plist"; plutil -p "$app/Contents/Info.plist" | grep -E "CFBundle(Identifier|Executable|ShortVersionString|Version)|LSMinimumSystemVersion"
          echo "== executable"; file "$exe"; lipo -archs "$exe"
          lipo -archs "$exe" | grep -qx arm64
          echo "== embedded JS bundle"; ls -l "$app/Contents/Resources/main.jsbundle"; file "$app/Contents/Resources/main.jsbundle"
          echo "== resources"; ls "$app/Contents/Resources" | head -50
          echo "== frameworks"; ls "$app/Contents/Frameworks" || true
          echo "== linked libraries"; otool -L "$exe"
          otool -L "$exe" | scripts/ci/check-macho-deps.sh
          for fw in "$app"/Contents/Frameworks/*.framework; do
            bin="$fw/$(basename "$fw" .framework)"
            echo "== deps: $bin"; otool -L "$bin" | scripts/ci/check-macho-deps.sh
          done
          # The upstream helper copy phase changes its bundle identifier after
          # extracting a pre-signed helper. Seal that copy, then the outer app.
          codesign --force --sign - --timestamp=none --preserve-metadata=entitlements \
            "$app/Contents/Library/LoginItems/LaunchAtLoginHelper.app"
          codesign --force --sign - --timestamp=none \
            --entitlements macos/sol-macOS/sol-macOS.entitlements "$app"
          echo "== signature"; codesign -dv --verbose=2 "$app" 2>&1
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "== entitlements"; codesign -d --entitlements - "$app" 2>&1 || true
          cd "$OUT_DIR"
          ditto -c -k --sequesterRsrc --keepParent Bettercast.app Bettercast-arm64-adhoc.zip
          ditto -x -k Bettercast-arm64-adhoc.zip "$RUNNER_TEMP/archive-check"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/archive-check/Bettercast.app"
          test -x "$RUNNER_TEMP/archive-check/Bettercast.app/Contents/MacOS/bettercast"
          test -L "$RUNNER_TEMP/archive-check/Bettercast.app/Contents/Frameworks/hermes.framework/Versions/Current"
          shasum -a 256 Bettercast-arm64-adhoc.zip | tee Bettercast-arm64-adhoc.zip.sha256
          echo "## Bettercast.app (arm64, ad-hoc)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat Bettercast-arm64-adhoc.zip.sha256 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Disposable native launch smoke
        timeout-minutes: 2
        run: python3 scripts/ci/smoke-app.py "$OUT_DIR/Bettercast.app" "$RUNNER_TEMP/native-smoke"

      - name: Upload native smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke
          path: ${{ runner.temp }}/native-smoke
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Bettercast-arm64-adhoc
          path: |
            build/out/Bettercast-arm64-adhoc.zip
            build/out/Bettercast-arm64-adhoc.zip.sha256
          retention-days: 7
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
